format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  check:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git: { }

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main:
        inputs:
        - contrib_section: docs/contribution.md

  sample:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-apps-fastlane-test.git
    - TEST_APP_BRANCH: master
    - BITRISE_PROJECT_PATH: sample-apps-fastlane-test.xcodeproj
    - BITRISE_SCHEME: sample-apps-fastlane-test
    - IPA_EXPORT_METHOD: development
    - APPSTORECONNECT_API_KEY_URL: $APPSTORECONNECT_API_KEY_URL
    - APPSTORECONNECT_API_KEY_ISSUER: $APPSTORECONNECT_API_KEY_ISSUER
    - BITRISE_CERTIFICATE_URL: $BITRISE_CERTIFICATE_URL
    - BITRISE_CERTIFICATE_PASSPHRASE: $BITRISE_CERTIFICATE_PASSPHRASE
    - BITRISE_KEYCHAIN_PATH: $BITRISE_KEYCHAIN_PATH
    - BITRISE_KEYCHAIN_PASSWORD: $BITRISE_KEYCHAIN_PASSWORD
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/env bash
            set -ex
            rm -rf ./_tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git@master:
        inputs:
        - repository_url: $TEST_APP_URL
        - branch: $TEST_APP_BRANCH
        - clone_into_dir: ./_tmp
    - path::./:
        run_if: "true"
        inputs:
        - connection: "off"
        - api_key_path: $APPSTORECONNECT_API_KEY_URL
        - api_issuer: $APPSTORECONNECT_API_KEY_ISSUER
        - certificate_urls: $BITRISE_CERTIFICATE_URL
        - passphrases: $BITRISE_CERTIFICATE_PASSPHRASE
        - distribution_type: $IPA_EXPORT_METHOD
        - project_path: ./_tmp/$BITRISE_PROJECT_PATH
        - scheme: $BITRISE_SCHEME
        - keychain_path: $BITRISE_KEYCHAIN_PATH
        - keychain_password: $BITRISE_KEYCHAIN_PASSWORD
        - verbose_log: "yes"
        - sign_uitest_targets: "yes"
        - register_test_devices: "no"

  apple_id_service_key_workaround:
    description: |-
      Example of the Script step that works around the Apple ID login failure: `Service key is empty`.

      Apple removed the `olympus/v1/app/config` endpoint that spaceship uses to fetch the Apple ID login
      widget key. Spaceship reads `/tmp/spaceship_itc_service_key.txt` before calling that endpoint, so
      writing the key there lets the login continue.

      Add this Script step before any Step that uses an Apple ID based Apple Service connection.
    steps:
    - script:
        title: Set the Apple ID login widget key
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            printf '%s' 'e0b80c3bf78523bfe80974d320935bfa30add02e1bff88ec2166c6bd5a706c42' > /tmp/spaceship_itc_service_key.txt
    - script:
        title: Read back the Apple ID login widget key
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            cat /tmp/spaceship_itc_service_key.txt
            echo
